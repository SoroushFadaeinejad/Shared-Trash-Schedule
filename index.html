<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Woodward Trash Schedule</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trash Schedule">
  <meta name="theme-color" content="#1A2233">

  <!-- Fonts: Playfair Display (Headings), Plus Jakarta Sans (UI Body), IBM Plex Mono (Data/Dates) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Home Screen Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <style>
    :root {
      --bg: #F5F4F0;
      --surface: #FFFFFF;
      --ink: #1A2233;
      --ink-soft: #4B5468;
      --muted: #7A8194;
      --brass: #A9824C;
      --brass-dark: #8A6B3D;
      --blue-accent: #2A4365;
      --line: #DEDACD;
      --danger: #A6472A;
    }
    * { box-sizing: border-box; }
    html {
      height: 100%;
      background-color: var(--bg);
      overscroll-behavior-y: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      margin: 0;
      min-height: 100%;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)) 20px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 28px 24px;
      max-width: 400px;
      margin: 0 auto 16px auto;
      text-align: center;
      box-shadow: 0 4px 12px rgba(26, 34, 51, 0.03);
    }
    .card:last-of-type {
      margin-bottom: 0;
    }
    .brand-icon {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-svg {
      width: 38px;
      height: 38px;
      color: var(--blue-accent);
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      font-size: 23px;
      margin: 0 0 18px 0;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .highlight-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 6px;
    }
    /* Plaque: signature element for current duty */
    .plaque {
      border: 1px solid var(--brass);
      border-radius: 4px;
      padding: 18px 16px 20px 16px;
      background: linear-gradient(180deg, rgba(169,130,76,0.06), rgba(169,130,76,0.02));
      position: relative;
    }
    .plaque::before,
    .plaque::after {
      content: "";
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: var(--line);
    }
    .plaque::before { left: 6px; }
    .plaque::after { right: 6px; }
    .highlight-date {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }
    .highlight-unit {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--brass-dark);
      letter-spacing: 0.02em;
      line-height: 1;
    }
    .selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    select {
      padding: 9px 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      background: var(--surface);
      color: var(--ink);
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    li {
      padding: 12px 4px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--ink-soft);
    }
    li:last-child {
      border-bottom: none;
    }
    .unit-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 500;
      font-size: 13px;
      color: var(--brass-dark);
      letter-spacing: 0.02em;
    }
    .install-banner {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      left: 12px;
      right: 12px;
      max-width: 400px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 8px 20px -4px rgba(26,34,51,0.12);
      padding: 14px 16px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }
    .install-banner-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .install-banner-text {
      flex: 1;
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.4;
    }
    .install-banner-text strong {
      display: block;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .install-banner-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .install-banner-btn {
      background: var(--ink);
      color: var(--bg);
      border: none;
      border-radius: 3px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .install-banner-dismiss {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 2px;
    }
  </style>
</head>
<body>

  <div class="install-banner" id="install-banner">
    <div class="install-banner-icon">
      <svg class="logo-svg" style="width: 28px; height: 28px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"></path>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17"></line>
        <line x1="14" y1="11" x2="14" y2="17"></line>
      </svg>
    </div>
    <div class="install-banner-text">
      <strong id="install-banner-title">Add to Home Screen</strong>
      <span id="install-banner-desc">Get the app icon on your Home Screen.</span>
    </div>
    <div class="install-banner-actions">
      <button class="install-banner-btn" id="install-banner-action">Add</button>
      <button class="install-banner-dismiss" id="install-banner-dismiss">Not now</button>
    </div>
  </div>

  <div class="card">
    <div class="brand-icon">
      <!-- Blue Match SVG Logo -->
      <svg class="logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18"></path>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        <line x1="10" y1="11" x2="10" y2="17" stroke="var(--brass)"></line>
        <line x1="14" y1="11" x2="14" y2="17" stroke="var(--brass)"></line>
      </svg>
    </div>
    <h1>Woodward Trash Schedule</h1>
    <div class="plaque">
      <div class="highlight-label">Upcoming / Current Duty</div>
      <div class="highlight-date" id="current-date">Loading...</div>
      <div class="highlight-unit" id="current-unit">--</div>
    </div>
  </div>

  <div class="card">
    <div class="selector">
      <select id="year-select"></select>
      <select id="month-select"></select>
    </div>
    <ul id="schedule-list"></ul>
  </div>

  <script>
    // Pattern base: Monday, July 6, 2026 is 73
    const baseDate = new Date(2026, 6, 6); // July 6, 2026 (Monday)
    const rotation = ["73", "71", "73A", "71A"];

    function getUnitForDate(date) {
      const diffTime = date - baseDate;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      const diffWeeks = Math.floor(diffDays / 7);
      const index = ((diffWeeks % 4) + 4) % 4;
      return rotation[index];
    }

    function getLastMondayOfMonth(year, month) {
      let d = new Date(year, month + 1, 0); // last calendar day of the month
      while (d.getDay() !== 1) {
        d.setDate(d.getDate() - 1);
      }
      return d;
    }

    function isMonthFullyPassed(year, month, today) {
      const lastMonday = getLastMondayOfMonth(year, month);
      const todayDateOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      return todayDateOnly > lastMonday;
    }

    let hiddenYear = null;
    let hiddenMonth = null;

    function populateMonthOptions(selectedYear, monthToSelect) {
      const monthSelect = document.getElementById("month-select");
      monthSelect.innerHTML = "";
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      months.forEach((m, idx) => {
        if (hiddenYear === selectedYear && hiddenMonth === idx) return;
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = m;
        if (idx === monthToSelect) opt.selected = true;
        monthSelect.appendChild(opt);
      });
    }

    function init() {
      const yearSelect = document.getElementById("year-select");
      const today = new Date();

      const startYear = today.getFullYear();
      const endYear = startYear + 10;
      for (let y = startYear; y <= endYear; y++) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        if (y === today.getFullYear()) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      let defaultYear = today.getFullYear();
      let defaultMonth = today.getMonth();
      if (isMonthFullyPassed(defaultYear, defaultMonth, today)) {
        hiddenYear = defaultYear;
        hiddenMonth = defaultMonth;
        defaultMonth++;
        if (defaultMonth > 11) {
          defaultMonth = 0;
          defaultYear++;
        }
      }

      if (![...yearSelect.options].some(o => parseInt(o.value) === defaultYear)) {
        const opt = document.createElement("option");
        opt.value = defaultYear;
        opt.textContent = defaultYear;
        yearSelect.appendChild(opt);
      }
      yearSelect.value = defaultYear;

      populateMonthOptions(defaultYear, defaultMonth);

      yearSelect.onchange = () => {
        populateMonthOptions(parseInt(yearSelect.value), null);
        renderSchedule();
      };
      document.getElementById("month-select").onchange = renderSchedule;

      // Find next Monday for current duty
      let nextMon = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      let dayOfWeek = nextMon.getDay();
      let daysUntilMonday = (1 - dayOfWeek + 7) % 7;
      nextMon.setDate(nextMon.getDate() + daysUntilMonday);

      document.getElementById("current-date").textContent = nextMon.toLocaleDateString("en-US", { month: "long", day: "numeric" });
      document.getElementById("current-unit").textContent = getUnitForDate(nextMon);

      renderSchedule();
    }

    function renderSchedule() {
      const year = parseInt(document.getElementById("year-select").value);
      const month = parseInt(document.getElementById("month-select").value);
      const list = document.getElementById("schedule-list");
      list.innerHTML = "";

      let date = new Date(year, month, 1);
      while (date.getDay() !== 1) {
        date.setDate(date.getDate() + 1);
      }

      while (date.getMonth() === month) {
        const dateStr = date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        const unit = getUnitForDate(date);

        const li = document.createElement("li");
        li.innerHTML = `<span>${dateStr}</span><span class="unit-tag">${unit}</span>`;
        list.appendChild(li);

        date.setDate(date.getDate() + 7);
      }
    }

    init();

    // --- Install to Home Screen banner ---
    function setupInstallBanner() {
      const banner = document.getElementById("install-banner");
      const title = document.getElementById("install-banner-title");
      const desc = document.getElementById("install-banner-desc");
      const actionBtn = document.getElementById("install-banner-action");
      const dismissBtn = document.getElementById("install-banner-dismiss");

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      const alreadyDismissed = localStorage.getItem("installBannerDismissed") === "true";

      if (isStandalone || alreadyDismissed) {
        return;
      }

      dismissBtn.addEventListener("click", () => {
        banner.style.display = "none";
        localStorage.setItem("installBannerDismissed", "true");
      });

      if (isIOS) {
        title.textContent = "Add to Home Screen";
        desc.textContent = "Tap the Share icon below, then \"Add to Home Screen\".";
        actionBtn.textContent = "Got it";
        actionBtn.addEventListener("click", () => {
          banner.style.display = "none";
        });
        banner.style.display = "flex";
      } else {
        let deferredPrompt = null;
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          deferredPrompt = e;
          banner.style.display = "flex";
        });

        actionBtn.addEventListener("click", async () => {
          if (!deferredPrompt) {
            banner.style.display = "none";
            return;
          }
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          banner.style.display = "none";
          localStorage.setItem("installBannerDismissed", "true");
        });
      }
    }
    setupInstallBanner();
  </script>
</body>
</html>
