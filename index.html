
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woodward Trash Schedule</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trash Schedule">
  <meta name="theme-color" content="#2563eb">

  <!-- Web App Manifest (enables "Add to Home Screen" on Android/Chrome) -->
  <link rel="manifest" href="manifest.json">

  <!-- Home Screen Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      padding-top: 70px;
      color: #1f2937;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: 0 auto 20px auto;
      text-align: center;
    }
    .header-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      color: #1e3a8a;
    }
    .highlight-label {
      font-size: 14px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .highlight-unit {
      font-size: 36px;
      font-weight: bold;
      color: #2563eb;
      margin: 4px 0 16px 0;
    }
    .highlight-date {
      font-size: 16px;
      font-weight: 600;
      color: #374151;
    }
    .selector {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      background: white;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: left;
    }
    li {
      padding: 12px 16px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    li:last-child {
      border-bottom: none;
    }
    .unit-tag {
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      background: #eff6ff;
      color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-icon">🗑️</div>
    <h1>Woodward Trash Schedule</h1>
    <div class="highlight-label">Upcoming / Current Duty</div>
    <div class="highlight-date" id="current-date">Loading...</div>
    <div class="highlight-unit" id="current-unit">--</div>
  </div>

  <div class="card">
    <div class="selector">
      <select id="year-select"></select>
      <select id="month-select"></select>
    </div>
    <ul id="schedule-list"></ul>
  </div>

  <script>
    // Pattern base: Monday, July 6, 2026 is 73
    const baseDate = new Date(2026, 6, 6); // July 6, 2026 (Monday)
    const rotation = ["73", "71", "73A", "71A"];

    function getUnitForDate(date) {
      const diffTime = date - baseDate;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      const diffWeeks = Math.floor(diffDays / 7);
      const index = ((diffWeeks % 4) + 4) % 4;
      return rotation[index];
    }

    function getLastMondayOfMonth(year, month) {
      // Start from the first day of the next month, then step back to the last Monday
      let d = new Date(year, month + 1, 0); // last calendar day of the month
      while (d.getDay() !== 1) {
        d.setDate(d.getDate() - 1);
      }
      return d;
    }

    function isMonthFullyPassed(year, month, today) {
      const lastMonday = getLastMondayOfMonth(year, month);
      // Compare date-only (ignore time of day)
      const todayDateOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      return todayDateOnly > lastMonday;
    }

    let hiddenYear = null;
    let hiddenMonth = null;

    function populateMonthOptions(selectedYear, monthToSelect) {
      const monthSelect = document.getElementById("month-select");
      monthSelect.innerHTML = "";
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      months.forEach((m, idx) => {
        // Skip the month that's fully passed, only within the year it applies to
        if (hiddenYear === selectedYear && hiddenMonth === idx) return;
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = m;
        if (idx === monthToSelect) opt.selected = true;
        monthSelect.appendChild(opt);
      });
    }

    function init() {
      const yearSelect = document.getElementById("year-select");
      const today = new Date();

      // Populate Years: current year through 10 years ahead
      const startYear = today.getFullYear();
      const endYear = startYear + 10;
      for (let y = startYear; y <= endYear; y++) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        if (y === today.getFullYear()) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      // Determine default month/year, skipping the current month if all its Mondays have passed
      let defaultYear = today.getFullYear();
      let defaultMonth = today.getMonth();
      if (isMonthFullyPassed(defaultYear, defaultMonth, today)) {
        hiddenYear = defaultYear;
        hiddenMonth = defaultMonth;
        defaultMonth++;
        if (defaultMonth > 11) {
          defaultMonth = 0;
          defaultYear++;
        }
      }

      // If the default rolled into a year not yet in the dropdown, add it
      if (![...yearSelect.options].some(o => parseInt(o.value) === defaultYear)) {
        const opt = document.createElement("option");
        opt.value = defaultYear;
        opt.textContent = defaultYear;
        yearSelect.appendChild(opt);
      }
      yearSelect.value = defaultYear;

      populateMonthOptions(defaultYear, defaultMonth);

      yearSelect.onchange = () => {
        populateMonthOptions(parseInt(yearSelect.value), null);
        renderSchedule();
      };
      document.getElementById("month-select").onchange = renderSchedule;

      // Find next Monday for current duty
      let nextMon = new Date(today);
      nextMon.setDate(today.getDate() + ((1 - today.getDay() + 7) % 7));
      document.getElementById("current-date").textContent = nextMon.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      document.getElementById("current-unit").textContent = getUnitForDate(nextMon);

      renderSchedule();
    }

    function renderSchedule() {
      const year = parseInt(document.getElementById("year-select").value);
      const month = parseInt(document.getElementById("month-select").value);
      const list = document.getElementById("schedule-list");
      list.innerHTML = "";

      // Get all Mondays in selected month
      let date = new Date(year, month, 1);
      while (date.getDay() !== 1) {
        date.setDate(date.getDate() + 1);
      }

      while (date.getMonth() === month) {
        const dateStr = date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
        const unit = getUnitForDate(date);

        const li = document.createElement("li");
        li.innerHTML = `<span>${dateStr}</span><span class="unit-tag">${unit}</span>`;
        list.appendChild(li);

        date.setDate(date.getDate() + 7);
      }
    }

    init();
  </script>
</body>
</html>
